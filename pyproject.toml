[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-join-audit"
version = "0.1.1"
description = "Audit microplate layout/result join keys before combining experimental tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Master-626"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1"]

[project.scripts]
plate-join-audit = "plate_join_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
