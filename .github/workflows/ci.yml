name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m build
      - name: Install wheel and rerun tests without editable source
        shell: bash
        run: |
          python -m pip uninstall -y plate-join-audit
          python -m pip install --no-deps dist/*.whl
          python -m pytest -q
          plate-join-audit examples/layout.csv examples/readings.csv
          plate-join-audit examples/layout.csv examples/time-series.csv --observation-column time
